[package]
name = "repo-explorer"
version = "0.1.0"
description = "A Tauri repository explorer desktop app"
authors = ["you"]
edition = "2021"

[lib]
name = "repo_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
explorer-json-store = { path = "../../../../explorer-kit/crates/json-store" }
explorer-scan-job = { path = "../../../../explorer-kit/crates/scan-job" }
explorer-fs-core = { path = "../../../../explorer-kit/crates/fs-core" }

[dev-dependencies]
tempfile = "3"
